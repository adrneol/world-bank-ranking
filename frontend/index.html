<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101828" />
    <script>
      try {
        if (localStorage.getItem('wdi-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#101b24';
        }
      } catch {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WDI Analysis" />
    <!-- public-metadata-start -->
    <meta
      name="description"
      content="Analytical views of World Bank World Development Indicators (WDI) observations: independently calculated rankings, movements, comparisons and coverage across economic indicators and countries."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Global Economic Research | WDI Research Explorer" />
    <meta
      property="og:description"
      content="Explore World Bank WDI observations with independently calculated rankings, movements, comparisons and coverage. The World Bank provides the raw observations; derived results are calculated by this application."
    />
    <meta property="og:image" content="/research-preview.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Global Economic Research | WDI Research Explorer" />
    <meta
      name="twitter:description"
      content="Explore World Bank WDI observations with independently calculated rankings, movements, comparisons and coverage."
    />
    <title>Global Economic Research | WDI Research Explorer</title>
    <!-- public-metadata-end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
